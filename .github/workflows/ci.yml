name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-useeffect:
    name: no-useeffect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if useEffect is in JS/TS source
        run: bash scripts/check-no-useeffect.sh

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            npm i -g bun
            bun install --frozen-lockfile
          else
            npm ci
          fi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        env:
          BETTER_AUTH_SECRET: ci-test-auth-secret-32-chars-minimum-ok
          BETTER_AUTH_URL: http://127.0.0.1:43129
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:43129
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm test
          elif [ -f yarn.lock ]; then
            yarn test
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun run test
          else
            npm test
          fi
